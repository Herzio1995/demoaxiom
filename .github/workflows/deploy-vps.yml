# Alternativa: publica el build en un servidor propio (nginx) por SSH + rsync,
# igual que los subdominios *.tilinka.com.
#
# Configuración en Settings → Secrets and variables → Actions:
#   Variables:  DEPLOY_TARGET = vps
#   Secrets:    SSH_HOST      ej. 203.0.113.10
#               SSH_USER      ej. deploy
#               SSH_KEY       clave privada (ed25519) autorizada en el servidor
#               SSH_PATH      ej. /var/www/axiom.tilinka.com
#               SSH_PORT      (opcional, por defecto 22)
name: Deploy · Servidor (SSH)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vps
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.DEPLOY_TARGET == 'vps'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Subir con rsync
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PATH: ${{ secrets.SSH_PATH }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_deploy -p $SSH_PORT" \
            dist/ "$SSH_USER@$SSH_HOST:$SSH_PATH/"
